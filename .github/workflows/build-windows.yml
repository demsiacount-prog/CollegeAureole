name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (frontend/src-tauri)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sidecar backend (PyInstaller)
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm college-aureole-backend.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller a échoué" }
          $triple = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path ..\frontend\src-tauri\binaries | Out-Null
          Copy-Item "dist\college-aureole-backend.exe" "..\frontend\src-tauri\binaries\college-aureole-backend-$triple.exe" -Force

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri (NSIS installer)
        working-directory: frontend
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: college-aureole-windows-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
