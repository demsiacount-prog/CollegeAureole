name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-tauri:
    name: Client Tauri (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Installer les dépendances front
        working-directory: frontend
        run: npm ci

      - name: Construire le client (NSIS)
        working-directory: frontend
        shell: pwsh
        env:
          # Le client ne contient aucun backend : la cible web est construite
          # telle quelle, l'URL du serveur est saisie au premier lancement.
          TAURI_SIGNING_PRIVATE_KEY: ''
        run: npm run tauri build -- --bundles nsis

      - name: Récupérer l'installeur
        shell: pwsh
        run: |
          $exe = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "college-aureole_x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: college-aureole_x64-setup.exe
          if-no-files-found: error

  client-linux:
    name: Client Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Installer les dépendances front
        working-directory: frontend
        run: npm ci

      - name: Construire le client (.deb)
        working-directory: frontend
        run: npm run tauri build -- --bundles deb

      - name: Récupérer le paquet
        run: |
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          cp "frontend/src-tauri/target/release/bundle/deb/College Aureole_${VERSION}_amd64.deb" \
             "college-aureole_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: college-aureole_*_amd64.deb
          if-no-files-found: error

  serveur-backend:
    name: Serveur backend (PyInstaller + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller~=6.10"

      - name: Construire l'exécutable serveur
        working-directory: backend
        run: pyinstaller college-aureole-backend.spec --noconfirm

      - name: Télécharger le wrapper de service WinSW
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/serveur/paquetage | Out-Null
          Invoke-WebRequest `
            https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe `
            -OutFile desktop/serveur/paquetage/college-aureole-service.exe

      - name: Assembler le paquetage NSIS
        shell: pwsh
        run: |
          Move-Item backend/dist/college-aureole-serveur desktop/serveur/paquetage/
          Copy-Item desktop/serveur/college-aureole-serveur.xml desktop/serveur/paquetage/

      - name: Installer NSIS et compiler l'installeur
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # NSIS ne crée pas les répertoires parents du fichier de sortie
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" desktop/serveur/serveur.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué (code $LASTEXITCODE)" }
          $exe = Get-ChildItem -Recurse -Filter college-aureole-serveur_x64-setup.exe |
            Select-Object -First 1
          if (-not $exe) { throw "Installeur serveur introuvable après compilation" }
          Move-Item $exe.FullName college-aureole-serveur_x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: serveur-windows
          path: college-aureole-serveur_x64-setup.exe
          if-no-files-found: error

  release:
    name: Publication GitHub Release
    needs: [client-tauri, client-linux, serveur-backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            college-aureole_x64-setup.exe
            college-aureole-serveur_x64-setup.exe
            college-aureole_*_amd64.deb
