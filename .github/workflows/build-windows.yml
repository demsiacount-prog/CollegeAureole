name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests-backend:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances (runtime + tests)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Exécuter la suite pytest
        working-directory: backend
        run: python -m pytest tests/ -q

  client-tauri:
    name: Client Tauri (NSIS)
    runs-on: windows-latest
    needs: [tests-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Installer les dépendances front
        working-directory: frontend
        run: npm ci

      - name: Construire le client (NSIS)
        working-directory: frontend
        shell: pwsh
        env:
          # En mono-poste, le client se connecte par défaut au serveur local
          # (http://localhost:8000) : la cible web est construite telle quelle.
          TAURI_SIGNING_PRIVATE_KEY: ''
        run: npm run tauri build -- --bundles nsis

      - name: Récupérer l'installeur
        shell: pwsh
        run: |
          $exe = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "college-aureole_x64-setup.exe"

      - name: Récupérer l'exécutable portable
        shell: pwsh
        run: |
          # Le binaire release garde le nom du crate (college-aureole.exe), pas
          # le productName (College Aureole) : on le cherche donc via Cargo.toml.
          $crateName = (Select-String -Path "frontend/src-tauri/Cargo.toml" -Pattern '^name\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $portable = Get-ChildItem "frontend/src-tauri/target/release/$crateName.exe" -ErrorAction SilentlyContinue
          if ($portable) {
            Copy-Item $portable.FullName "college-aureole-client.exe"
          } else {
            throw "Exécutable portable du client Tauri introuvable : $crateName.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: |
            college-aureole_x64-setup.exe
            college-aureole-client.exe
          if-no-files-found: error

  client-linux:
    name: Client Linux (.deb)
    runs-on: ubuntu-latest
    needs: [tests-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Installer les dépendances front
        working-directory: frontend
        run: npm ci

      - name: Construire le client (.deb)
        working-directory: frontend
        run: npm run tauri build -- --bundles deb

      - name: Récupérer le paquet
        run: |
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          cp "frontend/src-tauri/target/release/bundle/deb/College Aureole_${VERSION}_amd64.deb" \
             "college-aureole_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: college-aureole_*_amd64.deb
          if-no-files-found: error

  serveur-backend:
    name: Serveur backend + installeur tout-en-un
    runs-on: windows-latest
    needs: [tests-backend, client-tauri]
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger le client Tauri (tout-en-un)
        uses: actions/download-artifact@v4
        with:
          name: client-windows

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller~=6.10"

      - name: Construire l'exécutable serveur
        working-directory: backend
        run: pyinstaller college-aureole-backend.spec --noconfirm

      - name: Télécharger le wrapper de service WinSW
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/serveur/paquetage | Out-Null
          Invoke-WebRequest `
            https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe `
            -OutFile desktop/serveur/paquetage/college-aureole-service.exe

      - name: Assembler le paquetage NSIS
        shell: pwsh
        run: |
          Move-Item backend/dist/college-aureole-serveur desktop/serveur/paquetage/
          Copy-Item desktop/serveur/college-aureole-serveur.xml desktop/serveur/paquetage/
          Copy-Item college-aureole-client.exe desktop/serveur/paquetage/college-aureole-client.exe

      - name: Installer NSIS et compiler l'installeur tout-en-un
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $makensis = $null

          # 1) winget (CDN Microsoft, fiable) — prioritaire
          try {
            winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements 2>$null | Out-Null
            $c = @(Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" -ErrorAction SilentlyContinue)
            if ($c.Count -gt 0) { $makensis = $c[0].FullName }
          } catch {}

          # 2) scoop (préinstallé sur les runners windows) — si disponible
          if (-not $makensis) {
            try {
              scoop install nsis 2>$null | Out-Null
              $c = @(Get-ChildItem "$HOME\scoop\apps\nsis\current\makensis.exe" -ErrorAction SilentlyContinue)
              if ($c.Count -gt 0) { $makensis = $c[0].FullName }
            } catch {}
          }

          # 3) zip officiel via curl.exe (filet de sécurité, +robuste aux redirects)
          if (-not $makensis) {
            $nsisZip = "$env:RUNNER_TEMP\nsis.zip"
            curl.exe -L --retry 3 --connect-timeout 60 -sS -o $nsisZip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip"
            if ($LASTEXITCODE -eq 0 -and (Test-Path $nsisZip)) {
              Expand-Archive -Path $nsisZip -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
              $makensis = "$env:RUNNER_TEMP\nsis\nsis-3.10\makensis.exe"
            }
          }

          if (-not $makensis -or -not (Test-Path $makensis)) {
            throw "Aucune source n'a fourni makensis.exe (winget / scoop / curl)"
          }
          Write-Host "makensis: $makensis"

          # NSIS ne crée pas les répertoires parents du fichier de sortie
          New-Item -ItemType Directory -Force dist | Out-Null
          & $makensis desktop/serveur/tout-en-un.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis tout-en-un a échoué (code $LASTEXITCODE)" }
          $exe = Get-ChildItem -Recurse -Filter college-aureole-setup.exe |
            Select-Object -First 1
          if (-not $exe) { throw "Installeur tout-en-un introuvable après compilation" }
          Move-Item $exe.FullName college-aureole-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: serveur-windows
          path: college-aureole-setup.exe
          if-no-files-found: error

  release:
    name: Publication GitHub Release
    needs: [client-tauri, client-linux, serveur-backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            college-aureole-setup.exe
            college-aureole_x64-setup.exe
            college-aureole_*_amd64.deb
