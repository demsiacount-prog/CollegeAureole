[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    # Bruit interne à FastAPI/Starlette : import de TestClient via httpx
    # (dépréciation annoncée, non corrigible de notre côté).
    ignore:Using .*httpx.* starlette\\.testclient.* is deprecated:starlette.exceptions.StarletteDeprecationWarning
